        <div id="game">
            <script defer src="./scripts/game.js"></script>
            <div id="board">

                        <div class="piece white" data-piece="rook"></div>
                        <div class="piece white" data-piece="bishop"></div>
                        <div class="piece white" data-piece="knight"></div>
                        <div class="piece white" data-piece="king"></div>
                        <div class="piece white" data-piece="queen"></div>
                        <div class="piece white" data-piece="knight"></div>
                        <div class="piece white" data-piece="bishop"></div>
                        <div class="piece white" data-piece="rook"></div>

                        <div class="piece black" data-piece="king"></div>
                        <div class="piece black" data-piece="queen"></div>
                        <div class="piece black" data-piece="knight"></div>
                        <div class="piece black" data-piece="bishop"></div>
                        <div class="piece black" data-piece="rook"></div>
                    </div>
                </div>
                <div class="row">
                    <div data-col="a" data-row="1" class="square"></div>
                    <div data-col="b" data-row="1" class="square"></div>

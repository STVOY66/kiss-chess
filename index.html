<!DOCTYPE html>
<html>
    <head>
        <title>K.I.S.S. Chess</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="game">
            <script defer src="./scripts/game.js"></script>
            <div id="board">
                <div class="pieces">
                    <div class="white-pieces">
                        <div class="piece white pawn" style="transform: translate(0px, 80px)"></div>
                        <div class="piece white pawn" style="transform: translate(80px, 80px)"></div>
                        <div class="piece white pawn" style="transform: translate(160px, 80px)"></div>
                        <div class="piece white pawn" style="transform: translate(240px, 80px)"></div>
                        <div class="piece white pawn" style="transform: translate(320px, 80px)"></div>
                        <div class="piece white pawn" style="transform: translate(400px, 80px)"></div>
                        <div class="piece white pawn" style="transform: translate(480px, 80px)"></div>
                        <div class="piece white pawn" style="transform: translate(560px, 80px)"></div>
                        <div class="piece white rook" style="transform: translate(0px, 0px)"></div>
                        <div class="piece white rook" style="transform: translate(560px, 0px)"></div>
                        <div class="piece white bishop" style="transform: translate(160px, 0px)"></div>
                        <div class="piece white bishop" style="transform: translate(400px, 0px)"></div>
                        <div class="piece white knight" style="transform: translate(80px, 0px)"></div>
                        <div class="piece white knight" style="transform: translate(480px, 0px)"></div>
                        <div class="piece white king" style="transform: translate(320px, 0px)"></div>
                        <div class="piece white queen" style="transform: translate(240px, 0px)"></div>
                    </div>
                    <div class="black-pieces">
                        <div class="piece black pawn" style="transform: translate(0px, 480px)"></div>
                        <div class="piece black pawn" style="transform: translate(80px, 480px)"></div>
                        <div class="piece black pawn" style="transform: translate(160px, 480px)"></div>
                        <div class="piece black pawn" style="transform: translate(240px, 480px)"></div>
                        <div class="piece black pawn" style="transform: translate(320px, 480px)"></div>
                        <div class="piece black pawn" style="transform: translate(400px, 480px)"></div>
                        <div class="piece black pawn" style="transform: translate(480px, 480px)"></div>
                        <div class="piece black pawn" style="transform: translate(560px, 480px)"></div>
                        <div class="piece black rook" style="transform: translate(0px, 560px)"></div>
                        <div class="piece black rook" style="transform: translate(560px, 560px)"></div>
                        <div class="piece black bishop" style="transform: translate(160px, 560px)"></div>
                        <div class="piece black bishop" style="transform: translate(400px, 560px)"></div>
                        <div class="piece black knight" style="transform: translate(80px, 560px)"></div>
                        <div class="piece black knight" style="transform: translate(480px, 560px)"></div>
                        <div class="piece black king" style="transform: translate(320px, 560px)"></div>
                        <div class="piece black queen" style="transform: translate(240px, 560px)"></div>
                    </div>
                </div>
                <div class="row">
                    <div data-col="a" data-row="1" class="square"></div>
                    <div data-col="b" data-row="1" class="square"></div>
                    <div data-col="c" data-row="1" class="square"></div>
                    <div data-col="d" data-row="1" class="square"></div>
                    <div data-col="e" data-row="1" class="square"></div>
                    <div data-col="f" data-row="1" class="square"></div>
                    <div data-col="g" data-row="1" class="square"></div>
                    <div data-col="h" data-row="1" class="square"></div>
                </div>
                <div class="row">
                    <div data-col="a" data-row="2" class="square"></div>
                    <div data-col="b" data-row="2" class="square"></div>
                    <div data-col="c" data-row="2" class="square"></div>
                    <div data-col="d" data-row="2" class="square"></div>
                    <div data-col="e" data-row="2" class="square"></div>
                    <div data-col="f" data-row="2" class="square"></div>
                    <div data-col="g" data-row="2" class="square"></div>
                    <div data-col="h" data-row="2" class="square"></div>
                </div>
                <div class="row">
                    <div data-col="a" data-row="3" class="square"></div>
                    <div data-col="b" data-row="3" class="square"></div>
                    <div data-col="c" data-row="3" class="square"></div>
                    <div data-col="d" data-row="3" class="square"></div>
                    <div data-col="e" data-row="3" class="square"></div>
                    <div data-col="f" data-row="3" class="square"></div>
                    <div data-col="g" data-row="3" class="square"></div>
                    <div data-col="h" data-row="3" class="square"></div>
                </div>
                <div class="row">
                    <div data-col="a" data-row="4" class="square"></div>
                    <div data-col="b" data-row="4" class="square"></div>
                    <div data-col="c" data-row="4" class="square"></div>
                    <div data-col="d" data-row="4" class="square"></div>
                    <div data-col="e" data-row="4" class="square"></div>
                    <div data-col="f" data-row="4" class="square"></div>
                    <div data-col="g" data-row="4" class="square"></div>
                    <div data-col="h" data-row="4" class="square"></div>
                </div>
                <div class="row">
                    <div data-col="a" data-row="5" class="square"></div>
                    <div data-col="b" data-row="5" class="square"></div>
                    <div data-col="c" data-row="5" class="square"></div>
                    <div data-col="d" data-row="5" class="square"></div>
                    <div data-col="e" data-row="5" class="square"></div>
                    <div data-col="f" data-row="5" class="square"></div>
                    <div data-col="g" data-row="5" class="square"></div>
                    <div data-col="h" data-row="5" class="square"></div>
                </div>
                <div class="row">
                    <div data-col="a" data-row="6" class="square"></div>
                    <div data-col="b" data-row="6" class="square"></div>
                    <div data-col="c" data-row="6" class="square"></div>
                    <div data-col="d" data-row="6" class="square"></div>
                    <div data-col="e" data-row="6" class="square"></div>
                    <div data-col="f" data-row="6" class="square"></div>
                    <div data-col="g" data-row="6" class="square"></div>
                    <div data-col="h" data-row="6" class="square"></div>
                </div>
                <div class="row">
                    <div data-col="a" data-row="7" class="square"></div>
                    <div data-col="b" data-row="7" class="square"></div>
                    <div data-col="c" data-row="7" class="square"></div>
                    <div data-col="d" data-row="7" class="square"></div>
                    <div data-col="e" data-row="7" class="square"></div>
                    <div data-col="f" data-row="7" class="square"></div>
                    <div data-col="g" data-row="7" class="square"></div>
                    <div data-col="h" data-row="7" class="square"></div>
                </div>
                <div class="row">
                    <div data-col="a" data-row="8" class="square"></div>
                    <div data-col="b" data-row="8" class="square"></div>
                    <div data-col="c" data-row="8" class="square"></div>
                    <div data-col="d" data-row="8" class="square"></div>
                    <div data-col="e" data-row="8" class="square"></div>
                    <div data-col="f" data-row="8" class="square"></div>
                    <div data-col="g" data-row="8" class="square"></div>
                    <div data-col="h" data-row="8" class="square"></div>
                </div>
            </div>
        </div>
    </body>
</html>
